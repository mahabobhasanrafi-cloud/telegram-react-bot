services:
  - type: web
    name: telegram-react-bot
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    # NOTE: BOT_TOKENS is intentionally NOT listed here. Set it in the
    # Render dashboard (Service -> Environment -> Add Environment
    # Variable) so tokens never live in the repo. BOT_TOKENS is a
    # comma-separated list; one service runs all the bots.
    envVars:
      - key: REACTIONS
        value: "😭,🙏,😂,🤣,🙂,🙄,🤭,🥹,😅,🤔,🥲,👍,🥰,❤️,😁,😍,😡,😔,😌,😊,🥺"
